[build-system]
requires = ["setuptools>=68", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-sm89"
version = "0.3.1"
description = "Ada Lovelace (sm_89) SGLang acceleration suite: live FP8 autotuner, GDN ReplaySSM bridge, WY GDN CUDA verify, coupled speculative grammar, and kTileV=64 sparse vocab projection"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mert Ozoner" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/mrtozner/sglang-sm89"
Repository = "https://github.com/mrtozner/sglang-sm89"

[project.entry-points."sglang.plugins"]
sglang_sm89 = "sglang_sm89.plugin:register"

[project.entry-points."sglang.srt.plugins"]
sglang_sm89 = "sglang_sm89.plugin:register"

[tool.setuptools.packages.find]
include = ["sglang_sm89*"]
